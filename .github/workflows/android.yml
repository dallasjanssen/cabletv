name: Android build

# Builds only run for pushes to main. Use "Run workflow" on the Actions tab to build another branch by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_built: ${{ steps.release_build.outputs.built }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        # The GitHub Ubuntu image already includes the Android SDK and its command line tools.
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Decode release keystore
        # Only pushes to main get the signing secrets. Skipped when the keystore secret is not set.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.CABLETV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret; skipping the signed release build."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cabletv-release.jks"
          echo "CABLETV_KEYSTORE_PATH=$RUNNER_TEMP/cabletv-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        id: release_build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SKIP_RELEASE != 'true'
        env:
          CABLETV_KEYSTORE_PASSWORD: ${{ secrets.CABLETV_KEYSTORE_PASSWORD }}
          CABLETV_KEY_ALIAS: ${{ secrets.CABLETV_KEY_ALIAS }}
          CABLETV_KEY_PASSWORD: ${{ secrets.CABLETV_KEY_PASSWORD }}
        # The run number is the version code, so every new build is newer than the last.
        run: |
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cabletv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cabletv-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    # Publishes the signed APK so the TV can update itself. Only builds from main with the signing key get here.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.release_built == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: cabletv-release-apk
          path: release

      - name: Publish release for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "build-${GITHUB_RUN_NUMBER}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release build-${GITHUB_RUN_NUMBER} already exists; nothing to do."
            exit 0
          fi
          gh release create "build-${GITHUB_RUN_NUMBER}" \
            release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automatic build from commit ${GITHUB_SHA}."
