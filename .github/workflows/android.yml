name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        # The GitHub Ubuntu image already includes the Android SDK and its command line tools.
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Decode release keystore
        # Skipped when the keystore secret is not set, so the debug build still works.
        env:
          KEYSTORE_BASE64: ${{ secrets.CABLETV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret; skipping the signed release build."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cabletv-release.jks"
          echo "CABLETV_KEYSTORE_PATH=$RUNNER_TEMP/cabletv-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.SKIP_RELEASE != 'true'
        env:
          CABLETV_KEYSTORE_PASSWORD: ${{ secrets.CABLETV_KEYSTORE_PASSWORD }}
          CABLETV_KEY_ALIAS: ${{ secrets.CABLETV_KEY_ALIAS }}
          CABLETV_KEY_PASSWORD: ${{ secrets.CABLETV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cabletv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: env.SKIP_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cabletv-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
